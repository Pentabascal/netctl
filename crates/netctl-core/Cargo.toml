[package]
name = "netctl-core"
version = "0.1.3"
edition.workspace = true
description = "netctl: panel web de administración del servidor con módulos"
authors = ["Pentabascal <185202188+Pentabascal@users.noreply.github.com>"]
homepage = "https://github.com/Pentabascal/netctl"

[dependencies]
netctl-sdk.workspace = true
anyhow = "1"
argon2 = "0.5"
axum = "0.8"
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
base64.workspace = true
flate2 = "1"
getrandom.workspace = true
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
if-addrs = "0.13"
libc = "0.2"
ipnet.workspace = true
minisign-verify = "0.2"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots-no-provider"] }
rpassword = "7"
rust-embed = "8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
semver = { version = "1", features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
subtle = "2"
tar = "0.4"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
totp-rs = "5"

[dev-dependencies]
futures-util = "0.3"
minisign = "0.7"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

# `tools/empaquetar-nucleo.sh` compila para x86_64-unknown-linux-musl (binario estático).
[package.metadata.deb]
name = "netctl"
section = "admin"
priority = "optional"
depends = "systemd"
maintainer-scripts = "debian/"
assets = [
    ["target/release/netctl-core", "usr/bin/", "755"],
    ["../../packaging/netctl.service", "usr/lib/systemd/system/netctl.service", "644"],
]
extended-description = """\
Núcleo del panel netctl: HTTPS en el puerto 8443, inicio de sesión del administrador \
y gestor de módulos firmados (WireGuard, …) publicados en GitHub Releases."""

[package.metadata.generate-rpm]
name = "netctl"
summary = "Panel web de administración del servidor con módulos"
# El repo no tiene licencia publicada: todos los derechos reservados.
license = "LicenseRef-Proprietary"
post_install_script = "rpm/post.sh"
pre_uninstall_script = "rpm/preun.sh"
post_uninstall_script = "rpm/postun.sh"
assets = [
    { source = "target/release/netctl-core", dest = "/usr/bin/netctl-core", mode = "755" },
    { source = "../../packaging/netctl.service", dest = "/usr/lib/systemd/system/netctl.service", mode = "644" },
]
