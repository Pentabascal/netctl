[package]
name = "netctl-sdk"
version = "0.1.0"
edition.workspace = true

[dependencies]
anyhow = "1"
axum = "0.8"
semver = { version = "1", features = ["serde"] }
serde.workspace = true
tokio = { version = "1", features = ["net", "rt", "time", "fs"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util"] }
