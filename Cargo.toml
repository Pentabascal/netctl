[workspace]
resolver = "3"
members = ["crates/*", "modules/*", "apps/*"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
wg-modelo = { path = "crates/wg-modelo" }
netctl-sdk = { path = "crates/netctl-sdk" }
base64 = "0.22"
getrandom = "0.2"
ipnet = { version = "2", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
x25519-dalek = "2"

# argon2 sin optimizar hace los tests del núcleo muy lentos
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[profile.release]
strip = true
