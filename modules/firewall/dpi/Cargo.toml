[package]
name = "netctl-dpi"
version = "0.1.0"
edition.workspace = true
description = "Ayudante del Firewall de netctl: clasifica conexiones con la libndpi del sistema (NFQUEUE) y las marca para las reglas de App. Se compila con glibc."

[[bin]]
name = "netctl-dpi"
path = "src/main.rs"

[dependencies]
libloading = "0.8"
nfq = "0.2.6"
serde_json.workspace = true
