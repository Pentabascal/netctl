[package]
name = "netctl-mod-firewall"
version = "0.2.0"
edition.workspace = true
description = "Módulo Firewall de netctl: zonas, matriz zona→zona y reenvío de puertos con nftables"

[lib]
name = "netctl_mod_firewall"
path = "src/lib.rs"

[[bin]]
name = "netctl-mod-firewall"
path = "src/main.rs"

[dependencies]
netctl-sdk.workspace = true
anyhow = "1"
axum = "0.8"
ipnet.workspace = true
serde.workspace = true
serde_json.workspace = true
toml = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal", "net"] }

[dev-dependencies]
http-body-util = "0.1"
proptest = "1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
