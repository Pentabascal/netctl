[package]
name = "netctl-mod-wireguard"
version = "0.2.0"
edition.workspace = true
description = "Módulo WireGuard de netctl: servidor, clientes con permisos y estado en vivo"

[lib]
name = "netctl_mod_wireguard"
path = "src/lib.rs"

[[bin]]
name = "netctl-mod-wireguard"
path = "src/main.rs"

[dependencies]
wg-modelo.workspace = true
netctl-sdk.workspace = true
anyhow = "1"
axum = "0.8"
futures-util = "0.3"
ipnet.workspace = true
qrcode = { version = "0.15", default-features = false, features = ["svg"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
